name: Continuous Integration (CI)

on:
  push:
    branches: [main, "release/*", "hotfix/*", "chore/*"]
  pull_request:
    branches: [main, "release/*", "hotfix/*", "chore/*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Quality Checks, Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Security Vulnerability Audit & Expiring Allowlist Enforcement (High & Critical)
        run: node scripts/audit_allowlist.mjs


      - name: Database Migration Immutability & Ordering Gate
        run: npm run check:migrations

      - name: Dataset Provenance Verification
        run: npm run report:dataset

      - name: Subsystem Simulation Benchmark
        run: npm run benchmark:integration

      - name: Automated Component Quality & Integrity Check
        run: npm run check:components

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

      - name: Run Integration Tests & Safety Guards (No-DB Smoke)
        # Note: In test-and-build without a live database, live RLS tests skip safely.
        # The authoritative live database test run is executed in the `db-tests` job with REQUIRE_DB=1.
        run: npm run test:integration

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'placeholder-gemini-key' }}

  db-tests:
    name: Real Database Integration & RLS Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start Supabase Local Stack
        run: |
          supabase start
          supabase db reset --debug

      - name: Run Integration Tests against Local Supabase
        run: |
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2 | tr -d '"' | tr -d '\r')
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2 | tr -d '"' | tr -d '\r')
          SERVICE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2 | tr -d '"' | tr -d '\r')
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_KEY" \
          REQUIRE_DB=1 \
          npm run test:integration -- --reporter=default --reporter=json --outputFile=vitest-integration-report.json

      - name: Verify Live Database Tests Executed (Fail on 0 or Skipped)
        run: node scripts/verify_integration_tests.mjs vitest-integration-report.json 22

      - name: Dump Vitest Failures If Failed
        if: failure()
        run: node scripts/dump_vitest_failures.mjs vitest-integration-report.json

      - name: Stop Supabase Local Stack
        if: always()
        run: supabase stop

  e2e:
    name: Playwright End-to-End Tests (Local Supabase Stack)
    runs-on: ubuntu-latest
    needs: [test-and-build, db-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start Supabase Local Stack
        run: |
          supabase start
          supabase db reset --debug

      - name: Seed Local E2E Test Accounts with Ephemeral Credentials
        run: |
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2 | tr -d '"' | tr -d '\r')
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2 | tr -d '"' | tr -d '\r')
          SERVICE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2 | tr -d '"' | tr -d '\r')

          # Generate cryptographically secure ephemeral credentials for this CI run
          E2E_ADMIN_PWD=$(node -e "console.log('Adm!' + crypto.randomUUID().slice(0, 12))")
          E2E_DOCTOR_PWD=$(node -e "console.log('Doc!' + crypto.randomUUID().slice(0, 12))")
          E2E_PATIENT_PWD=$(node -e "console.log('Pat!' + crypto.randomUUID().slice(0, 12))")

          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PWD" >> $GITHUB_ENV
          echo "E2E_DOCTOR_PASSWORD=$E2E_DOCTOR_PWD" >> $GITHUB_ENV
          echo "E2E_PATIENT_PASSWORD=$E2E_PATIENT_PWD" >> $GITHUB_ENV

          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_KEY" \
          E2E_ADMIN_PASSWORD="$E2E_ADMIN_PWD" \
          E2E_DOCTOR_PASSWORD="$E2E_DOCTOR_PWD" \
          E2E_PATIENT_PASSWORD="$E2E_PATIENT_PWD" \
          node scripts/seed_e2e_users.js

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests against Local Environment
        run: npx playwright test
        env:
          CI: "true"

      - name: Stop Supabase Local Stack
        if: always()
        run: supabase stop
