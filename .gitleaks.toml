  '''YOUR_[A-Z0-9_]+''',
  '''<your-[a-z0-9_-]+>''',
  '''ruralhealth\.(demo|test)''',
  '''sb_publishable_placeholder''',
  '''https://placeholder\.supabase\.co'''
