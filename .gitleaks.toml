[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Source checksum map: a file path mapped to an exact SHA-256 digest, not a credential"
regexTarget = "match"
regexes = ['''[A-Za-z0-9_./-]+\.(tsx?|m?js|json|css|py)"?\s*:\s*"[a-f0-9]{64}"''']
[[rules.allowlists]]
description = "Legacy public browser storage key, retained to preserve local profile compatibility"
regexTarget = "match"
regexes = ['''STORAGE_KEY\s*=\s*"ruralhealth_emergency_vault_v1"''']
